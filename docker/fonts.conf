<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installed as /etc/fonts/local.conf by the Dockerfile. Calibri, Cambria,
  Arial, Times New Roman and Courier New already resolve to their
  metric-compatible clones (Carlito, Caladea, Liberation) through
  fontconfig's own 30-metric-aliases.conf. These cover the other fonts
  common in Office documents that have no free metric clone, pointing each
  at the installed font closest in width so text wraps where it did in Word.
-->
<fontconfig>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Lucida Console</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
