# Production deployment.
# Run: docker compose up -d --build   (from this directory)
# Put this host's public IP/domain behind a reverse proxy with TLS (e.g.
# Caddy/nginx) before pointing NEXT_PUBLIC_APP_URL / MINIO_ENDPOINT /
# MEILISEARCH_HOST at it.
#
# This brings up the app plus its self-hosted MinIO/Meilisearch/Ollama
# dependencies. Self-hosted Supabase (auth + Postgres) is deployed
# separately from Supabase's own official docker-compose stack
# (https://github.com/supabase/supabase/tree/master/docker) — point the
# app's SUPABASE_*/DATABASE_URL/DIRECT_URL vars at wherever that stack
# ends up running (same Docker network, another host, etc.).

version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "3001:3000"
    networks:
      - default
      - supabase_default
    depends_on:
      - minio
      - meilisearch
      - ollama
    restart: unless-stopped

  # Runs the scheduled maintenance scripts (retention cleanup, staleness
  # check, weekly digest — see docker/crontab) that used to require a
  # manually-configured cron entry on the host. Same image as `app`, just a
  # different entrypoint/command, so it always stays in sync with whatever
  # code got deployed. Needs root (crond requires it) — unlike `app`, this
  # service is never network-exposed, so that's a contained trade-off.
  cron:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    user: root
    entrypoint: ["/app/docker/cron-entrypoint.sh"]
    networks:
      - default
      - supabase_default
    depends_on:
      - app
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "admin12345"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # One-shot: waits for `ollama` to be ready, pulls OLLAMA_MODEL (already
  # in .env, used by lib/assistant.ts for the staleness check), then exits.
  # Re-running is cheap — ollama pull is a no-op once the model is cached in
  # the ollama_data volume, so it's safe for this to run again on every
  # `docker compose up`.
  ollama-pull:
    image: ollama/ollama:latest
    env_file:
      - ../.env
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export OLLAMA_HOST=http://ollama:11434;
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull "$${OLLAMA_MODEL:-llama3.1:8b}"
    restart: "no"

volumes:
  minio_data:
  meili_data:
  ollama_data:
networks:
  supabase_default:
    external: true
