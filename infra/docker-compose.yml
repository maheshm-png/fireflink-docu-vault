# Production deployment.
# Run: docker compose up -d --build   (from this directory)
# Put this host's public IP/domain behind a reverse proxy with TLS (e.g.
# Caddy/nginx) before pointing NEXT_PUBLIC_APP_URL / MINIO_ENDPOINT /
# MEILISEARCH_HOST at it.
#
# This brings up the app plus its self-hosted MinIO/Meilisearch/Ollama
# dependencies. Self-hosted Supabase (auth + Postgres) is deployed
# separately from Supabase's own official docker-compose stack
# (https://github.com/supabase/supabase/tree/master/docker) — point the
# app's SUPABASE_*/DATABASE_URL/DIRECT_URL vars at wherever that stack
# ends up running (same Docker network, another host, etc.).

version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      - minio
      - meilisearch
      - ollama
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # After first start: docker exec -it <container> ollama pull llama3.1:8b

volumes:
  minio_data:
  meili_data:
  ollama_data:
